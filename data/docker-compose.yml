services:
  mysql:
    image: mysql:8.4
    container_name: bookstore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Crie o arquivo data/.env a partir do .env.example}
    command: --character-set-server=utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql_dados:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_dados:
